name: Bundles

# Served bundles (<chain>_feeds.json) must semantically match their config/
# sources; nodes sync only the bundles (#260).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: one group per PR, superseded runs cancelled. Pushes: one group per
  # commit, so every master commit gets a result.
  group: bundles-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: Check served bundles match sources
        run: python script/collect-files.py --check

      # All script tests (#296); test_generate_configs needs requests (mocked, no network).
      - name: Install script deps
        # Run even if the bundle check failed, not if setup did (#307).
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: pip install -r requirements.txt

      - name: Unit tests (script/test_*.py)
        # Not gated on deps: only test_generate_configs needs requests.
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: python -m unittest discover -s script -p 'test_*.py'
