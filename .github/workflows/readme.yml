name: README

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Pushes use the orakl-bot App token, not GITHUB_TOKEN: a GITHUB_TOKEN push
# gets no normal CI on the new head (#266).
permissions:
  contents: read

concurrency:
  group: readme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs PR-branch Python, so it never gets the App token (#294).
  regenerate:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same-repo PR: the head commit itself (push job commits on top).
          # Fork PR / dispatch: default ref (read-only check).
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check README (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          python script/generate-readme.py --check || {
            echo "::error::README.md is out of date (checked on the merge with master). Merge master into your branch, run 'python script/generate-readme.py', commit README.md."
            exit 1
          }

      - name: Regenerate README
        id: regen
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            python script/generate-readme.py --check || {
              echo "::error::README.md is out of date on $REF_NAME; regenerate it in a PR."
              exit 1
            }
            exit 0
          fi
          python script/generate-readme.py
          if git diff --quiet -- README.md; then
            echo "README.md up to date; no changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload README
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme
          path: README.md
          retention-days: 1

  # Gets the token; runs no PR code: fresh checkout, takes only the README
  # file from the regenerate job.
  push:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      # Same-repo PRs without Actions secrets (e.g. Dependabot) get an empty
      # key: fail with a clear message (like fork PRs), not in
      # create-github-app-token (#306).
      BOT_KEY_SET: ${{ secrets.GH_ORAKL_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: No orakl-bot key
        if: env.BOT_KEY_SET != 'true'
        run: |
          echo "::error::README.md is out of date and this run has no orakl-bot key (e.g. Dependabot PR), so it can't push. Run 'python script/generate-readme.py' and commit README.md."
          exit 1

      - name: Generate GitHub App Token
        id: app-token
        if: env.BOT_KEY_SET == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv1.c13a65499d8e95e6
          private-key: ${{ secrets.GH_ORAKL_BOT_PRIVATE_KEY }}
          owner: bisonai
          repositories: orakl-config
          permission-contents: write

      - uses: actions/checkout@v4
        if: env.BOT_KEY_SET == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: env.BOT_KEY_SET == 'true'
        with:
          name: readme
          path: ${{ runner.temp }}/readme

      # Push re-triggers this workflow on the new head; it regenerates no diff
      # there, so no loop. Same commit as regenerate checked out: if the branch
      # moved meanwhile, the push is rejected (non-fast-forward), not clobbered,
      # and the job passes: the run for the new head regenerates (#306).
      - name: Commit and push README
        if: env.BOT_KEY_SET == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          README_SRC: ${{ runner.temp }}/readme/README.md
        run: |
          cp "$README_SRC" README.md
          git config user.name "orakl-bot[bot]"
          git config user.email "162664606+orakl-bot[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate README"
          # Header via GIT_CONFIG_* env: not in .git/config or argv.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          err="$RUNNER_TEMP/push.err"
          if git push origin "HEAD:$HEAD_REF" 2>"$err"; then
            cat "$err"
            exit 0
          fi
          cat "$err" >&2
          # Only a non-ff reject is benign; auth/network/protection still fail.
          if grep -qE '\[rejected\]|non-fast-forward|fetch first' "$err"; then
            echo "::notice::$HEAD_REF moved after this run started; README push rejected (non-fast-forward). The run for the new head regenerates."
            exit 0
          fi
          exit 1
