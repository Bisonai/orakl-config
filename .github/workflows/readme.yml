name: README

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Pushes use the orakl-bot App token, not GITHUB_TOKEN: a GITHUB_TOKEN push
# gets no normal CI on the new head (#266).
permissions:
  contents: read

concurrency:
  group: readme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      # Same-repo PR only: fork PRs get no secrets.
      - name: Generate GitHub App Token
        id: app-token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv1.c13a65499d8e95e6
          private-key: ${{ secrets.GH_ORAKL_BOT_PRIVATE_KEY }}
          owner: bisonai
          repositories: orakl-config
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          # Same-repo PR: check out the branch itself so we can push to it.
          # Fork PR / dispatch: default ref (read-only check).
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          # Don't leave the App token in .git/config while PR-branch scripts
          # run; only the push step gets it (#294).
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check README (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          python script/generate-readme.py --check || {
            echo "::error::README.md is out of date (checked on the merge with master). Merge master into your branch, run 'python script/generate-readme.py', commit README.md."
            exit 1
          }

      - name: Regenerate README
        id: regen
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            python script/generate-readme.py --check || {
              echo "::error::README.md is out of date on $REF_NAME; regenerate it in a PR."
              exit 1
            }
            exit 0
          fi
          python script/generate-readme.py
          if git diff --quiet -- README.md; then
            echo "README.md up to date; no changes."
            exit 0
          fi
          git config user.name "orakl-bot[bot]"
          git config user.email "162664606+orakl-bot[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate README"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Separate step: the token is not in the env of the regen step. Header via
      # GIT_CONFIG_* env (not .git/config, not argv); hooks off so nothing the
      # regen step wrote under .git/hooks runs with it.
      # Push re-triggers this workflow on the new head; it regenerates no diff
      # there and exits above, so no loop.
      - name: Push README
        if: steps.regen.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth"
          git push origin "HEAD:$HEAD_REF"
