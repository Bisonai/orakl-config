name: Notify orakl

# Tells Bisonai/orakl to regenerate contracts/v0.2/addresses/feeds.json from this commit's config.
on:
  push:
    branches: [master]
    paths:
      - '*_feeds.json'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Send repository_dispatch to orakl
        env:
          # Fine-grained PAT: repo Bisonai/orakl, Contents read+write.
          GH_TOKEN: ${{ secrets.ORAKL_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ORAKL_DISPATCH_TOKEN not set; orakl will pick this up on its daily run."
            exit 0
          fi
          gh api repos/Bisonai/orakl/dispatches \
            -f event_type=orakl-config-published \
            -f "client_payload[sha]=$SHA"
